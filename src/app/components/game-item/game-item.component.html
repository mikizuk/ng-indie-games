<h1>{{ game.title }}</h1>

<app-game-form
  [eventType]="eventType"
  [game]="game"
  (formSubmit)="onSubmitClick($event)"
>
  <button class="button button--far-left" (click)="onDeleteClick(game.id)">
    Delete
  </button>
  <button
    class="button"
    routerLink="/game-list"
    routerLinkActive="router-link-active"
  >
    Back
  </button>
</app-game-form>
